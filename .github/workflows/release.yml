name: release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/ci.yml"

permissions: {}

env:
  TRIVY_VERSION: "0.74.0"
  GITOPS_REPO: nginnu/rabbit-gitops
  SERVICE: web-ui

jobs:
  build:
    name: build · web-ui
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rabbit-${{ env.SERVICE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web-ui
          cache-to: type=gha,scope=web-ui,mode=max
          provenance: false

      - name: install trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy

      - name: trivy image
        run: |
          trivy image \
            "${{ secrets.DOCKERHUB_USERNAME }}/rabbit-${{ env.SERVICE }}:${{ steps.meta.outputs.tag }}" \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format sarif \
            --output trivy-web-ui.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-web-ui
          path: trivy-web-ui.sarif
          retention-days: 14

  promote:
    name: promote · gitops
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Shares the group with rabbit-api's promote: both push to the same branch
    # of the same repo, and two checkouts racing produce a non-fast-forward that
    # looks like a flaky release.
    concurrency:
      group: promote-gitops
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: write image tag
        env:
          REGISTRY_NS: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          chart="gitops/charts/${SERVICE}"
          [ -d "$chart" ] || { echo "::error::no chart at ${chart}"; exit 1; }
          printf '%s\n' \
            "# Written by ${GITHUB_REPOSITORY}@${GITHUB_SHA}." \
            "# Generated — the next release overwrites this file." \
            "services:" \
            "  ${SERVICE}:" \
            "    image:" \
            "      repository: ${REGISTRY_NS}/rabbit-${SERVICE}" \
            "      tag: ${TAG}" \
            "      pullPolicy: IfNotPresent" \
            > "${chart}/values-ci.yaml"
          git -C gitops diff --stat

      - name: commit and push
        working-directory: gitops
        run: |
          git config user.name "rabbit-ci"
          git config user.email "ci@rabbit.invalid"
          if git diff --quiet; then
            echo "tag unchanged — nothing to promote"
            exit 0
          fi
          git add "charts/${SERVICE}/values-ci.yaml"
          git commit -m "chore(images): web ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          echo "::error::could not push to ${GITOPS_REPO} after 3 attempts"
          exit 1
