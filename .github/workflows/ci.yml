name: ci

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  NODE_VERSION: "20"
  GITOPS_REPO: nginnu/rabbit-gitops
  SERVICE: web-ui
  GITLEAKS_VERSION: "8.30.1"
  TRUFFLEHOG_VERSION: "3.97.0"
  TRIVY_VERSION: "0.74.0"
  SEMGREP_VERSION: "1.173.0"

jobs:
  guardrails:
    name: guardrails · secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - run: gitleaks git . --report-format sarif --report-path gitleaks.sarif --redact --exit-code 1
      - name: install trufflehog
        if: always()
        run: |
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin trufflehog
      - name: trufflehog · verified only
        if: always()
        run: |
          trufflehog git file://. --only-verified --fail --json > trufflehog.json || status=$?
          cat trufflehog.json
          exit "${status:-0}"
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: guardrails-reports
          path: |
            gitleaks.sarif
            trufflehog.json
          retention-days: 14

  # There is no unit test suite in this repo yet — package.json has dev, build,
  # start and lint and nothing else. What this job proves is that the app
  # type-checks under strict and compiles; it does not prove any behaviour. A
  # green run here is not the same claim the Go side's `go test` makes.
  build:
    name: build · typecheck + next build
    needs: guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm ci, not npm install: install rewrites package-lock.json when the
      # tree drifts, so CI would build a dependency set nobody committed.
      - run: npm ci

      # `npm run lint` is not called here. next lint with no eslint config in
      # the repo prompts for one interactively, and a prompt on a runner is a
      # job that hangs until the six-hour timeout. Restore this step in the same
      # change that adds an .eslintrc.
      #
      # tsconfig has strict: true, so this is a real check and not a formality.
      # --noEmit because next build does the emitting.
      - name: typecheck
        run: npx tsc --noEmit

      - run: npm run build

      - name: build output size
        run: |
          {
            echo "### next build"
            echo '```'
            du -sh .next
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sast:
    name: sast · semgrep
    needs: guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "semgrep==${SEMGREP_VERSION#v}"
      # p/typescript and p/react cover the BFF routes under app/api, which is
      # where this app talks to the services and handles the session cookie.
      - run: semgrep --config p/typescript --config p/react --config p/ci --sarif --output semgrep.sarif --error
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: sca · trivy fs
    needs: guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
      # The ignored licences are libvips, pulled in as @img/sharp-libvips-* by
      # the sharp that Next installs for image optimisation. libvips is LGPL and
      # sharp links it dynamically; the obligation attaches on distribution and
      # this is deployed as a service. Named one by one rather than dropping the
      # licence scanner, so a package arriving under GPL still fails.
      - name: trivy fs
        run: |
          trivy fs . \
            --scanners vuln,secret,license \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignored-licenses LGPL-3.0-or-later \
            --ignored-licenses 'Apache-2.0 AND LGPL-3.0-or-later' \
            --ignored-licenses 'Apache-2.0 AND LGPL-3.0-or-later AND MIT' \
            --format sarif \
            --output trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  licensed-scanners-available:
    name: licensed scanners · availability
    needs: guardrails
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      sonar: ${{ steps.check.outputs.sonar }}
      snyk: ${{ steps.check.outputs.snyk }}
    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "sonar=${SONAR_TOKEN:+true}" >> "$GITHUB_OUTPUT"
          echo "snyk=${SNYK_TOKEN:+true}" >> "$GITHUB_OUTPUT"
          {
            echo "### licensed scanners"
            echo "| scanner | token | status |"
            echo "|---|---|---|"
            echo "| SonarQube | SONAR_TOKEN | ${SONAR_TOKEN:+configured}${SONAR_TOKEN:-absent — skipped} |"
            echo "| Snyk | SNYK_TOKEN | ${SNYK_TOKEN:+configured}${SNYK_TOKEN:-absent — skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"

  sonarqube:
    name: sast · sonarqube
    needs: [build, licensed-scanners-available]
    if: needs.licensed-scanners-available.outputs.sonar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  snyk:
    name: sca · snyk
    needs: [guardrails, licensed-scanners-available]
    if: needs.licensed-scanners-available.outputs.snyk == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: snyk.sarif
          category: snyk

  # Was a separate release.yml. Merged in so the gate is a real `needs`: with
  # two workflows on the same push there is no ordering between them, and an
  # image was pushed to Docker Hub while semgrep and trivy were still failing.
  #
  # Both conditions are needed. github.event_name keeps it off pull_request,
  # where secrets are not available and nothing should be published; the ref
  # check keeps it off any other branch that gets pushed.
  image:
    name: image · build + push
    needs: [build, sast, sca]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rabbit-${{ env.SERVICE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web-ui
          cache-to: type=gha,scope=web-ui,mode=max
          provenance: false

      - name: install trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy

      # The base image, not the lockfile. sca above reads package-lock.json and
      # knows nothing about what the runtime layer ships.
      - name: trivy image
        run: |
          trivy image \
            "${{ secrets.DOCKERHUB_USERNAME }}/rabbit-${{ env.SERVICE }}:${{ steps.meta.outputs.tag }}" \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format sarif \
            --output trivy-web-ui.sarif

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-image-web-ui
          path: trivy-web-ui.sarif
          retention-days: 14

  promote:
    name: promote · gitops
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Shares the group with rabbit-api's promote: both push to the same branch
    # of the same repo, and two checkouts racing produce a non-fast-forward that
    # looks like a flaky release.
    concurrency:
      group: promote-gitops
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: write image tag
        env:
          REGISTRY_NS: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          chart="gitops/charts/${SERVICE}"
          [ -d "$chart" ] || { echo "::error::no chart at ${chart}"; exit 1; }
          # printf, not a heredoc: inside `run: |` every line carries the
          # block's indentation, and an indented delimiter never closes a plain
          # <<EOF — the step runs to the end of the script looking for it.
          printf '%s\n' \
            "# Written by ${GITHUB_REPOSITORY}@${GITHUB_SHA}." \
            "# Generated — the next release overwrites this file." \
            "services:" \
            "  ${SERVICE}:" \
            "    image:" \
            "      repository: ${REGISTRY_NS}/rabbit-${SERVICE}" \
            "      tag: ${TAG}" \
            "      pullPolicy: IfNotPresent" \
            > "${chart}/values-ci.yaml"
          git -C gitops diff --stat

      - name: commit and push
        working-directory: gitops
        run: |
          git config user.name "rabbit-ci"
          git config user.email "ci@rabbit.invalid"
          if git diff --quiet; then
            echo "tag unchanged — nothing to promote"
            exit 0
          fi
          git add "charts/${SERVICE}/values-ci.yaml"
          git commit -m "chore(images): web ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          echo "::error::could not push to ${GITOPS_REPO} after 3 attempts"
          exit 1

  gate:
    name: ci gate
    needs: [guardrails, build, sast, sca]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "::error::one or more ci jobs failed"
            exit 1
          fi
